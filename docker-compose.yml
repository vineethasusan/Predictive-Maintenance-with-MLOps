services:
  api:
    build: .
    ports: ["8000:8000"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["mlflow:/mlflow"]

  airflow:
    image: apache/airflow:2.9.3-python3.11
    command: standalone
    ports: ["8080:8080"]
    environment:
      _PIP_ADDITIONAL_REQUIREMENTS: "scikit-learn pandas joblib mlflow"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/fleet-pm
    depends_on: [mlflow]

volumes:
  mlflow:
